<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Provisioning Tool</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <div class="hdr">
        <h1>Access request</h1>
        <span class="muted">automatic parser</span>
      </div>
      <div class="body">
        <textarea id="src" placeholder="Paste the access request here..."></textarea>
      </div>
    </section>

    <section class="panel">
      <div class="hdr"><h1>Parsed values</h1></div>
      <div class="body">
        <div class="row"><label>Name</label><input id="name"></div>
        <div class="row"><label>Surname</label><input id="surname"></div>
        <div class="row"><label>Email</label><input id="email"></div>
        <div class="row"><label>Employee Number</label><input id="employeeNumber"></div>
        <div class="row"><label>Employee ID</label><input id="employeeId"></div>
        <div class="row"><label>Main Workplace</label><input id="workplace"></div>
        <div class="row"><label>Login</label><input id="login"></div>
        <div class="row"><label>Additional Workplaces</label><input id="extraWorkplaces"></div>

        <div class="btns">
          <button id="uppercase">LOGIN → UPPERCASE</button>
          <button id="copy">Copy SQL</button>
          <span id="state" class="muted"></span>
        </div>

        <div class="sqlwrap">
          <div class="sqlhdr" id="toggle"><b>View generated SQL</b></div>
          <pre class="sql" id="sql"></pre>
        </div>

        <div class="note">Portfolio demo only. Authentication logic and real database schema are intentionally excluded.</div>
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
